name: MLflow CI - Titanic

# Workflow CI: melatih ulang model lewat MLflow Project, menyimpan artefak,
# lalu membangun Docker Image dan push ke Docker Hub via `mlflow build-docker`.

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  MLPROJECT_DIR: MLProject
  IMAGE_NAME: titanic-ci
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build-and-train:
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash -el {0}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.7"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install \
            "mlflow>=2.20.0,<3.0" \
            scikit-learn==1.5.2 \
            pandas==2.2.3 \
            numpy==1.26.4 \
            matplotlib==3.9.2

      - name: Run MLflow Project
        working-directory: ${{ env.MLPROJECT_DIR }}
        run: |
          mlflow run . --env-manager=local
          echo "RUN_ID=$(cat run_id.txt)" >> "$GITHUB_ENV"
          echo "Trained run_id: $(cat run_id.txt)"

      - name: Upload MLflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mlflow-artifacts
          path: |
            ${{ env.MLPROJECT_DIR }}/mlruns/
            ${{ env.MLPROJECT_DIR }}/run_id.txt
          retention-days: 30

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & push Docker image (mlflow build-docker)
        working-directory: ${{ env.MLPROJECT_DIR }}
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          set -e
          MODEL_URI="runs:/${RUN_ID}/model"
          IMAGE_TAG="${DOCKERHUB_USERNAME}/${IMAGE_NAME}:latest"
          echo "::notice::Image tag = ${IMAGE_TAG}"
          echo "Building image $IMAGE_TAG dari $MODEL_URI"
          mlflow models build-docker \
            --model-uri "$MODEL_URI" \
            --name "$IMAGE_TAG" \
            --env-manager local
          echo "::notice::Local images:"
          docker images "${DOCKERHUB_USERNAME}/${IMAGE_NAME}"
          echo "Pushing..."
          docker push "$IMAGE_TAG"
          echo "::notice::Push BERHASIL ke ${IMAGE_TAG}"
          echo "Pushed: https://hub.docker.com/r/${DOCKERHUB_USERNAME}/${IMAGE_NAME}"
