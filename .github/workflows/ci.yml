name: MLflow CI - Titanic

# Workflow CI: melatih ulang model lewat MLflow Project, menyimpan artefak,
# lalu membangun Docker Image dan push ke Docker Hub via `mlflow build-docker`.

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:        # bisa dijalankan manual dari tab Actions

env:
  # Lokasi MLflow Project di dalam repo
  MLPROJECT_DIR: MLProject
  # Nama image Docker Hub (ganti sesuai akun Anda lewat repo variable bila perlu)
  IMAGE_NAME: titanic-ci
  # Paksa JavaScript actions berjalan di Node.js 24 (Node 20 sudah deprecated).
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build-and-train:
    runs-on: ubuntu-latest

    # Diangkat ke level job agar bisa dipakai pada step `if:` (secret tidak bisa
    # direferensikan langsung di dalam ekspresi `if`).
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

    defaults:
      run:
        shell: bash -l {0}        # login shell agar conda aktif

    steps:
      # 1. Ambil kode dari repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Siapkan Python
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.7"

      # 3. Install MLflow + dependency training (env-manager=local)
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install \
            mlflow==2.19.0 \
            scikit-learn==1.5.2 \
            pandas==2.2.3 \
            numpy==1.26.4 \
            matplotlib==3.9.2

      # 4. Jalankan MLflow Project (training + logging artefak lokal ke mlruns/)
      - name: Run MLflow Project
        working-directory: ${{ env.MLPROJECT_DIR }}
        run: |
          mlflow run . --env-manager=local
          echo "RUN_ID=$(cat run_id.txt)" >> "$GITHUB_ENV"
          echo "Trained run_id: $(cat run_id.txt)"

      # 5. Simpan artefak (model + plots + reports) sebagai artefak workflow
      - name: Upload MLflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mlflow-artifacts
          path: |
            ${{ env.MLPROJECT_DIR }}/mlruns/
            ${{ env.MLPROJECT_DIR }}/run_id.txt
          retention-days: 30

      # 6. Login ke Docker Hub (skip otomatis bila secret belum lengkap)
      - name: Log in to Docker Hub
        if: ${{ env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != '' }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 7. Build Docker Image dari model MLflow lalu push ke Docker Hub
      - name: Build & push Docker image (mlflow build-docker)
        if: ${{ env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != '' }}
        working-directory: ${{ env.MLPROJECT_DIR }}
        run: |
          MODEL_URI="runs:/${RUN_ID}/model"
          IMAGE_TAG="${DOCKERHUB_USERNAME}/${IMAGE_NAME}:latest"
          echo "::notice::Target namespace = ${DOCKERHUB_USERNAME}"
          echo "::notice::Image tag        = ${IMAGE_TAG}"
          echo "Building image $IMAGE_TAG dari $MODEL_URI"
          mlflow models build-docker \
            --model-uri "$MODEL_URI" \
            --name "$IMAGE_TAG"
          echo "::notice::Docker images:"
          docker images | grep titanic
          echo "::notice::Pushing with verbose output..."
          docker push "$IMAGE_TAG" 2>&1 | tee /tmp/push_output.txt
          PUSH_EXIT=$?
          echo "::notice::Push exit code = ${PUSH_EXIT}"
          if [ $PUSH_EXIT -ne 0 ]; then
            echo "::error::Docker push FAILED"
            cat /tmp/push_output.txt
            exit 1
          fi
          echo "Pushed: https://hub.docker.com/r/${DOCKERHUB_USERNAME}/${IMAGE_NAME}"

      # 8. Pastikan repository Docker Hub bersifat PUBLIC (agar dapat diakses
      #    tanpa login). Repo hasil auto-create bisa saja privat tergantung
      #    setelan akun, sehingga di-set publik secara eksplisit di sini.
      - name: Make Docker Hub repo public
        if: ${{ env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != '' }}
        run: |
          JWT=$(curl -s -H "Content-Type: application/json" \
            -X POST -d "{\"username\":\"${DOCKERHUB_USERNAME}\",\"password\":\"${DOCKERHUB_TOKEN}\"}" \
            https://hub.docker.com/v2/users/login/ | python -c "import sys,json;print(json.load(sys.stdin).get('token',''))")
          if [ -z "$JWT" ]; then
            echo "::warning::Gagal login ke Docker Hub API; lewati set-public."
            exit 0
          fi
          CODE=$(curl -s -o /tmp/resp.json -w "%{http_code}" \
            -X PATCH \
            -H "Authorization: JWT ${JWT}" \
            -H "Content-Type: application/json" \
            -d '{"is_private": false}' \
            "https://hub.docker.com/v2/repositories/${DOCKERHUB_USERNAME}/${IMAGE_NAME}/")
          echo "::notice::Set-public HTTP ${CODE}"
          cat /tmp/resp.json || true
