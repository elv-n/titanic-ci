name: MLflow CI - Titanic

# Workflow CI: melatih ulang model lewat MLflow Project, menyimpan artefak,
# lalu membangun Docker Image dan push ke Docker Hub via `mlflow build-docker`.

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  MLPROJECT_DIR: MLProject
  IMAGE_NAME: titanic-ci
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build-and-train:
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash -l {0}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.7"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install \
            mlflow==2.19.0 \
            scikit-learn==1.5.2 \
            pandas==2.2.3 \
            numpy==1.26.4 \
            matplotlib==3.9.2

      - name: Run MLflow Project
        working-directory: ${{ env.MLPROJECT_DIR }}
        run: |
          mlflow run . --env-manager=local
          echo "RUN_ID=$(cat run_id.txt)" >> "$GITHUB_ENV"
          echo "Trained run_id: $(cat run_id.txt)"

      - name: Upload MLflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mlflow-artifacts
          path: |
            ${{ env.MLPROJECT_DIR }}/mlruns/
            ${{ env.MLPROJECT_DIR }}/run_id.txt
          retention-days: 30

      - name: Log in to Docker Hub
        if: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & push Docker image (mlflow build-docker)
        if: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
        working-directory: ${{ env.MLPROJECT_DIR }}
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          MODEL_URI="runs:/${RUN_ID}/model"
          IMAGE_TAG="${DOCKERHUB_USERNAME}/${IMAGE_NAME}:latest"
          echo "::notice::Image tag = ${IMAGE_TAG}"
          echo "Building image $IMAGE_TAG dari $MODEL_URI"
          mlflow models build-docker \
            --model-uri "$MODEL_URI" \
            --name "$IMAGE_TAG"
          echo "Pushing..."
          docker push "$IMAGE_TAG"
          echo "::notice::Push berhasil!"
          echo "Pushed: https://hub.docker.com/r/${DOCKERHUB_USERNAME}/${IMAGE_NAME}"

      - name: Make Docker Hub repo public
        if: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          JWT=$(curl -s -H "Content-Type: application/json" \
            -X POST -d "{\"username\":\"${DOCKERHUB_USERNAME}\",\"password\":\"${DOCKERHUB_TOKEN}\"}" \
            https://hub.docker.com/v2/users/login/ | python -c "import sys,json;print(json.load(sys.stdin).get('token',''))")
          if [ -z "$JWT" ]; then
            echo "::warning::Gagal login ke Docker Hub API; lewati set-public."
            exit 0
          fi
          CODE=$(curl -s -o /tmp/resp.json -w "%{http_code}" \
            -X PATCH \
            -H "Authorization: JWT ${JWT}" \
            -H "Content-Type: application/json" \
            -d '{"is_private": false}' \
            "https://hub.docker.com/v2/repositories/${DOCKERHUB_USERNAME}/${IMAGE_NAME}/")
          echo "::notice::Set-public HTTP ${CODE}"
          cat /tmp/resp.json || true
